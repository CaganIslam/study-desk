[project]
name = "study-desk"
version = "0.0.1"
description = "Local-first study companion: course slides, lecture recordings and Claude explanations, slide by slide."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
study-desk = "studydesk.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
